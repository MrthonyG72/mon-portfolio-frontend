<a class="skip-link" href="#contenu">Aller au contenu</a>

<header class="header" [class.is-scrolled]="scrolled() || !onHome()" [class.is-open]="menuOpen()">
  <div class="container header__inner">
    <a href="#accueil" class="header__logo" (click)="go($event, 'accueil')" aria-label="Anzouan, retour à l'accueil">
      Anzouan<span>.</span>
    </a>

    <nav class="header__nav" aria-label="Navigation principale">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              [class.is-active]="active() === link.id"
              [attr.aria-current]="active() === link.id ? 'true' : null"
              (click)="go($event, link.id)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <a href="#contact" class="btn btn--primary btn--small header__cta" (click)="go($event, 'contact')">
      Me contacter
    </a>

    <button
      type="button"
      class="header__burger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-mobile"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="menu-backdrop" [class.is-open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<nav id="menu-mobile" class="menu" [class.is-open]="menuOpen()" aria-label="Menu mobile">
  <ul>
    @for (link of links; track link.id) {
      <li>
        <a [href]="'#' + link.id" [class.is-active]="active() === link.id" (click)="go($event, link.id)">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
